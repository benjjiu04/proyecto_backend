{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - LimarGO</title>
</head>
<body>
    <div class="login-page">
        <form method="post" class="form-card login-card">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <header class="form-card-head">
                <h2>Iniciar sesión</h2>
                <p>Sistema de gestión LimarGO</p>
            </header>

            {% if form.errors %}
                <div class="form-alert" role="alert"><p>Usuario o contraseña incorrectos. Revisa los datos e inténtalo de nuevo.</p></div>
            {% endif %}

            <div class="form-grid single">
                <div class="field">
                    <label for="id_username">Usuario</label>
                    <input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
                </div>
                <div class="field">
                    <label for="id_password">Contraseña</label>
                    <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required>
                </div>
            </div>
            <p style="text-align:center;margin:0 0 22px">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
            <footer class="form-card-foot">
                
                <button type="submit" class="btn btn-primary" style="width:100%">Entrar</button>
            </footer>
        </form>
    </div>
</body>
</html>
