<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - LimarGO</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/globals.css' %}">
</head>
<body>
    <div class="login-container" style="max-width: 400px; margin: 100px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif;">
        <h2>Iniciar Sesión - LimarGO</h2>
        
        {% if form.errors %}
            <p style="color: red; font-size: 14px;">Usuario o contraseña incorrectos. Inténtalo de nuevo.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%;">Entrar</button>
        </form>
    </div>
</body>
</html>
