{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema LimarGO</title>
    <link rel="stylesheet" href="{% static 'css/todos.css' %}">
    <link rel="stylesheet" href="{% static 'css/viajes.css' %}">
    <link rel="stylesheet" href="{% static 'css/globals.css' %}">
    <link rel="stylesheet" href="{% static 'css/todos.css' %}">
    <link rel="stylesheet" href="{% static 'css/viajes.css' %}">
</head>
<body>

    <!-- navbar -->
    <div class="nav-tabs">
        <a href="{% url 'inicio' %}" class="nav-tab {% if request.resolver_match.url_name == 'inicio' %}active{% endif %}"> Home </a>
        <a href="{% url 'listar_clientes' %}" class="nav-tab {% if 'cliente' in request.resolver_match.url_name %}active{% endif %}"> Clientes </a>
        <a href="{% url 'listar_vehiculos' %}" class="nav-tab {% if 'vehiculo' in request.resolver_match.url_name %}active{% endif %}">Vehiculos</a>
        <a href="{% url 'listar_viajes' %}" class="nav-tab {% if 'viaje' in request.resolver_match.url_name %}active{% endif %}"> Viajes </a>
        <a href="{% url 'listar_pagos' %}" class="nav-tab {% if 'pago' in request.resolver_match.url_name %}active{% endif %}"> Pagos </a>
        <a href="{% url 'listar_mantenciones' %}" class="nav-tab {% if 'mantencion' in request.resolver_match.url_name %}active{% endif %}"> Mantenciones </a>
    </div>

    <div class="content-container">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}<div class="msg {{ message.tags }}" role="status">{{ message }}</div>{% endfor %}
        </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
