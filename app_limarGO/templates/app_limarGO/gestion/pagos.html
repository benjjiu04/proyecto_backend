{% extends 'gestion/base.html' %}

{% block content %}
<div class="sub-tabs">
    <a href="{% url 'inicio' %}" class="sub-tab"> Home </a>
    <span class="sub-tab active"> Pagos </span>
</div>

<div class="action-bar">
    <div class="search-box">
        <input type="text" placeholder="Buscar viaje por destino...">
        <button class="btn btn-go">Go</button>
    </div>
    <div>
        <a href="#" class="btn btn-primary">Registrar pago &gt;</a>
    </div>
</div>

<table>
    <thead>
        <tr>
            <th>ID viaje</th>
            <th>Monto</th>
            <th>Fecha de pago</th>
            <th>Metodo de pago</th>
            <th> Estado </th>
           
        </tr>
    </thead>
    <tbody>
        {% for pa in pago %}
        <tr>
            <td> {{pa.id_viaje}} </td>
            <td> {{pa.monto}} </td>
            <td> {{pa.fecha_pago}} </td>
            <td> {{pa.metodo}} </td>
            <td> {{pa.estado}}</td>
            
        </tr>
        {% empty %}
        <tr>
            <td colspan="7" style="text-align: center; color: #64748b; padding: 20px;">No hay viajes registrados.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
